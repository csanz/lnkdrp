name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Unit suites only. `tests:agent:vitest` is a live-model eval (calls OpenAI, needs a key,
      # non-deterministic) and stays out of CI on purpose; run it by hand.
      - run: npm test
