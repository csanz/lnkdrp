# The two long-running Node services that cannot live on Vercel. Build from the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file .env.production.services up -d --build
# Put MONGODB_URI, REALTIME_SECRET (same value as the web app's), LNKDRP_API_URL, MCP_PUBLIC_URL and
# NEXT_PUBLIC_REALTIME_URL in that env file. Terminate TLS in front (Caddy, nginx, the host's LB) so
# browsers reach wss://realtime.lnkdrp.com and clients reach https://mcp.lnkdrp.com.
services:
  realtime:
    build:
      context: ..
      dockerfile: realtime/Dockerfile
    image: lnkdrp-realtime
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI}
      REALTIME_SECRET: ${REALTIME_SECRET}
      REALTIME_PORT: "8788"
    ports:
      - "8788:8788"

  mcp:
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    image: lnkdrp-mcp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LNKDRP_API_URL: ${LNKDRP_API_URL:-https://lnkdrp.com}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://mcp.lnkdrp.com}
      MCP_PORT: "8787"
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-ws://realtime:8788}
      REALTIME_SECRET: ${REALTIME_SECRET}
    ports:
      - "8787:8787"
    depends_on:
      - realtime
