# Dev copy of mcp.fly.toml under a dev- name; the API URL and public URL are overridden at deploy time.
# fly deploy -a dev-lnkdrp-mcp --config deploy/fly/dev-mcp.fly.toml --dockerfile mcp/Dockerfile --ha=false -e MCP_PUBLIC_URL=https://dev-lnkdrp-mcp.fly.dev -e NEXT_PUBLIC_REALTIME_URL=
app = "dev-lnkdrp-mcp"
primary_region = "iad"

[build]
  dockerfile = "../../mcp/Dockerfile"

[env]
  NODE_ENV = "production"
  MCP_PORT = "8787"
  # The www host, not the apex: lnkdrp.com answers 308 to www, and the MCP's API client does not
  # follow redirects (`redirect: "manual"`), so the apex would fail every tool call.
  LNKDRP_API_URL = "https://www.lnkdrp.com"
  MCP_PUBLIC_URL = "https://mcp.lnkdrp.com"
  NEXT_PUBLIC_REALTIME_URL = "wss://realtime.lnkdrp.com"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false      # MCP sessions live in memory
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    # Each connected agent holds an open GET /mcp SSE request, so these cap connected agents.
    type = "requests"
    soft_limit = 1000
    hard_limit = 2000
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
