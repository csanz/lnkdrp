# Fly.io app for the MCP server.
# Deploy steps: DEPLOY.md 6.2 and 7 (the only copy of the commands).
# The first deploy must pass --ha=false, and the app must stay exactly one machine:
# sessions live in memory, so a second machine answers `404 Session not found`.
app = "lnkdrp-mcp"
primary_region = "iad"

[build]
  dockerfile = "../../mcp/Dockerfile"

[env]
  NODE_ENV = "production"
  MCP_PORT = "8787"
  LNKDRP_API_URL = "https://lnkdrp.com"
  MCP_PUBLIC_URL = "https://mcp.lnkdrp.com"
  NEXT_PUBLIC_REALTIME_URL = "wss://realtime.lnkdrp.com"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false      # MCP sessions live in memory
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    # Each connected agent holds an open GET /mcp SSE request, so these cap connected agents.
    type = "requests"
    soft_limit = 1000
    hard_limit = 2000
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
